<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뒤에서 일어나는 일</title>
<style>
  :root { --ui: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #07080c; font-family: var(--ui); }
  body { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 20px; }
  .hide { display: none !important; }
  /* ---------------------------------------------------------------- 과정 흐름 그래프 */
  .flow { --fbg: #0d0f15; --fcard: #151821; --fline: rgba(255,255,255,.09); --ftext: #eceef4; --fmuted: #8a90a2;
          --fmono: "SF Mono", "JetBrains Mono", "D2Coding", ui-monospace, Menlo, monospace;
          margin: 0 auto; width: 100%; max-width: 1560px; border-radius: 18px; color: var(--ftext); overflow: hidden;
          background:
            radial-gradient(1200px 380px at 70% -10%, rgba(139,124,246,.16), transparent 60%),
            radial-gradient(800px 300px at 0% 110%, rgba(90,169,230,.10), transparent 60%),
            radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.2px) 0 0 / 22px 22px,
            var(--fbg);
          box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -20px rgba(13,15,21,.55); }
  .flow-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap;
               padding: 20px 26px 4px; }
  .flow-head .eyebrow { font: 600 11px var(--fmono); letter-spacing: .16em; color: #a99bff; text-transform: uppercase; }
  .flow-head h2 { font-size: 19px; font-weight: 650; margin: 4px 0 0; letter-spacing: -0.02em; }
  .flow-head p { margin: 4px 0 0; font-size: 13px; color: var(--fmuted); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--fmuted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px;
              box-shadow: 0 0 8px currentColor; }
  .flow-scroll { overflow-x: auto; padding: 0 10px 14px; }
  .flow svg { display: block; width: 100%; min-width: 900px; height: auto; font-family: var(--ui); }
  .fn { transition: opacity .35s ease; }
  .fn .shape { fill: var(--fcard); stroke: var(--acc); stroke-opacity: .28; stroke-width: 1.2;
               transition: stroke-opacity .3s, filter .3s, transform .3s cubic-bezier(.2,.8,.2,1);
               transform-box: fill-box; transform-origin: center; }
  .fn .bar { fill: var(--acc); opacity: .9; }
  .fn .kind { font: 600 9.5px var(--fmono); letter-spacing: .14em; fill: var(--acc); }
  .fn .t { font-size: 15px; font-weight: 650; fill: var(--ftext); letter-spacing: -0.01em; }
  .fn .sub { font: 500 12px var(--fmono); fill: var(--fmuted); }
  .fn .thumb { stroke: rgba(255,255,255,.14); fill: #000; }
  .fn.path .shape { stroke-opacity: .95; }
  .fn.path .sub { fill: #c7ccd8; }
  .fn.on .shape { stroke-opacity: 1; stroke-width: 1.6; filter: url(#glow); transform: scale(1.035); }
  .fn .ring { fill: none; stroke: var(--acc); stroke-width: 1.5; stroke-dasharray: 40 556; opacity: 0; stroke-linecap: round; }
  .fn.on .ring { opacity: 1; animation: spin 1.1s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { stroke-dashoffset: -596; } }
  .flow.ran .fn:not(.path) { opacity: .32; }
  .fe { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 1.2; transition: stroke .3s, opacity .3s; }
  .fe.path { stroke: #a99bff; stroke-width: 1.8; filter: url(#soft); }
  .flow.ran .fe:not(.path) { opacity: .35; }
  .fl text { font: 600 10.5px var(--fmono); fill: var(--fmuted); letter-spacing: .04em; }
  .fl rect { fill: var(--fbg); stroke: rgba(255,255,255,.1); }
  .fl.path text { fill: #cfc6ff; } .fl.path rect { stroke: rgba(169,155,255,.6); }
  .flow.ran .fl:not(.path) { opacity: .35; }
  #comet { fill: none; stroke: url(#cometGrad); stroke-width: 3.2; stroke-linecap: round; filter: url(#glow); opacity: 0; }
  #pk { fill: #fff; filter: url(#glow); opacity: 0; }
  .note { width: 100%; height: 100%; box-sizing: border-box; padding: 16px 18px; border-radius: 12px;
          background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
          border: 1px solid var(--fline); font: 14px/1.6 var(--ui); color: #d4d8e2; }
  .note .h { display: flex; align-items: center; gap: 8px; font: 600 10.5px var(--fmono); letter-spacing: .16em;
             color: var(--fmuted); margin-bottom: 8px; text-transform: uppercase; }
  .note .h::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #a99bff; box-shadow: 0 0 10px #a99bff; }
  .note b { color: #fff; font-weight: 650; }
  .note .tm { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .note .tm span { border: 1px solid var(--fline); border-radius: 999px; padding: 2px 10px; font: 500 11.5px var(--fmono);
                   color: #aab0c0; font-variant-numeric: tabular-nums; }
  .note .tm span.big { border-color: rgba(169,155,255,.55); color: #fff; background: rgba(139,124,246,.18); }
  @media (prefers-reduced-motion: reduce) { .fn.on .ring { animation: none; } .fn .shape, .fn, .fe { transition: none; } }
  @media (prefers-reduced-motion: reduce) { .fn.on .ring { animation: none; } .fn .shape { transition: none; } }
  .status { display: flex; align-items: center; gap: 8px; margin-top: 10px; font: 500 12.5px var(--fmono); color: var(--fmuted); flex-wrap: wrap; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #e3b65c; box-shadow: 0 0 8px #e3b65c; }
  .status .dot.ok { background: #5fd38d; box-shadow: 0 0 8px #5fd38d; }
  .status .typed { color: #eceef4; font-family: var(--ui); font-size: 15px; font-weight: 600; margin-left: 10px;
                   max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status .typed:not(:empty)::before { content: "입력"; font: 600 10.5px var(--fmono); letter-spacing: .14em; color: var(--fmuted);
                   border: 1px solid var(--fline); border-radius: 999px; padding: 1px 8px; margin-right: 8px; vertical-align: 2px; }
  .open { color: #a99bff; }
  @media (max-width: 640px) { body { padding: 8px; } }
</style>
</head>
<body>
  <section class="flow" id="flow">
    <div class="flow-head">
      <div><div class="eyebrow">Live trace</div><h2>뒤에서 일어나는 일</h2>
        <p>데모 페이지에서 키를 칠 때마다 그 요청이 실제로 거친 길과 값을 보여 줍니다</p>
        <div class="status"><span class="dot" id="dot"></span><span id="conn">서버에 연결하는 중…</span><span class="typed" id="typed"></span></div></div>
      <div class="legend"><span><i style="color:#c9ced9;background:#c9ced9"></i>입출력</span><span><i style="color:#8b7cf6;background:#8b7cf6"></i>처리</span>
        <span><i style="color:#e3b65c;background:#e3b65c"></i>판단</span><span><i style="color:#ef7f8c;background:#ef7f8c"></i>신경망</span>
        <span><i style="color:#5aa9e6;background:#5aa9e6"></i>결과</span></div>
    </div>
    <div class="flow-scroll"><svg id="fsvg" viewBox="0 0 1300 440" role="img" aria-label="요청 처리 흐름도"></svg></div>
  </section>

<script>
const $ = (id) => document.getElementById(id);
// ---------------------------------------------------------------- 과정 흐름 그래프
const FC = { io: ["#c9ced9", "입출력"], proc: ["#8b7cf6", "처리"], dec: ["#e3b65c", "판단"],
             nn: ["#ef7f8c", "신경망"], out: ["#5aa9e6", "결과"] };
const FN = {
  key:   { x: 75,   y: 165, w: 116, h: 60,  sh: "pill", c: "io",   t: "키 입력" },
  parse: { x: 237,  y: 165, w: 144, h: 76,  sh: "rect", c: "proc", t: "자모 분해" },
  syl:   { x: 410,  y: 165, w: 150, h: 100, sh: "dia",  c: "dec",  t: "음절 완성?" },
  cache: { x: 590,  y: 165, w: 150, h: 100, sh: "dia",  c: "dec",  t: "캐시에 있나?" },
  jamo:  { x: 410,  y: 44,  w: 164, h: 54,  sh: "rect", c: "io",   t: "낱자는 흐리게" },
  hit:   { x: 830,  y: 165, w: 170, h: 76,  sh: "rect", c: "out",  t: "캐시에서 꺼내기" },
  paper: { x: 1222, y: 165, w: 128, h: 64,  sh: "pill", c: "io",   t: "종이에 놓기" },
  noise: { x: 590,  y: 317, w: 144, h: 122, sh: "rect", c: "proc", t: "노이즈 z", img: 1 },
  unet:  { x: 765,  y: 317, w: 152, h: 122, sh: "rect", c: "nn",   t: "HangulUNet", img: 1, ring: 1 },
  step:  { x: 937,  y: 317, w: 144, h: 122, sh: "rect", c: "proc", t: "오일러 한 걸음", img: 1 },
  more:  { x: 1090, y: 317, w: 112, h: 94,  sh: "dia",  c: "dec",  t: "스텝 남음?" },
  png:   { x: 1222, y: 317, w: 112, h: 76,  sh: "rect", c: "out",  t: "PNG로 묶기" },
};
const FE = {
  e_key:   ["M133,165 H165"],
  e_parse: ["M309,165 H335"],
  e_syl:   ["M485,165 H515", "예", 500, 152],
  e_jamo:  ["M410,115 V71", "아니오", 440, 96],
  e_jp:    ["M492,44 H1222 V133"],
  e_hit:   ["M665,165 H745", "예", 705, 152],
  e_hp:    ["M915,165 H1158"],
  e_miss:  ["M590,215 V256", "아니오", 622, 236],
  e_z:     ["M662,317 H689"],
  e_u:     ["M841,317 H865"],
  e_x:     ["M1009,317 H1034"],
  e_done:  ["M1146,317 H1166", "끝", 1156, 300],
  e_loop:  ["M1090,364 V414 H765 V378", "예 · 다음 스텝", 928, 414],
  e_pp:    ["M1222,279 V197"],
};
const SVGNS = "http://www.w3.org/2000/svg";
const F = { run: 0, nodes: {}, edges: {}, labels: {}, busy: false, next: null };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function sv(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function flowInit() {
  const svg = $("fsvg");
  const defs = sv("defs", {}, svg);
  defs.innerHTML = `
    <filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1340" height="480"><feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1340" height="480"><feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="cometGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1300" y2="0">
      <stop offset="0" stop-color="#d9d2ff"/><stop offset="1" stop-color="#a99bff"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#cfc6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>`;
  for (const [id, n] of Object.entries(FN)) if (n.img) {
    const c = sv("clipPath", { id: "clip-" + id }, defs);
    sv("rect", { x: n.x - 22, y: n.y - n.h / 2 + 46, width: 44, height: 44, rx: 6 }, c);
  }
  // 요약 카드: 방금 일어난 일
  const fo = sv("foreignObject", { x: 26, y: 250, width: 462, height: 178 }, svg);
  fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" class="note"><div class="h">방금 일어난 일</div><div id="nmsg">글자를 입력하면 여기에 과정이 나옵니다.</div><div class="tm" id="ntm"></div></div>`;
  for (const [id, [d, lab, lx, ly]] of Object.entries(FE)) {
    F.edges[id] = sv("path", { d, class: "fe", "marker-end": "url(#ah)" }, svg);
    if (lab) {
      const g = sv("g", { class: "fl" }, svg);
      const w = lab.length * 10.5 + 16;
      sv("rect", { x: lx - w / 2, y: ly - 9.5, width: w, height: 19, rx: 9.5 }, g);
      const t = sv("text", { x: lx, y: ly + 3.8, "text-anchor": "middle" }, g); t.textContent = lab;
      F.labels[id] = g;
    }
  }
  F.comet = sv("path", { id: "comet" }, svg);
  for (const [id, n] of Object.entries(FN)) {
    const [acc, kind] = FC[n.c];
    const g = sv("g", { class: "fn", id: "n-" + id, style: `--acc:${acc}` }, svg);
    const L = n.x - n.w / 2, T = n.y - n.h / 2;
    if (n.sh === "dia") sv("path", { class: "shape", d: `M${n.x},${T} L${n.x + n.w / 2},${n.y} L${n.x},${T + n.h} L${L},${n.y} Z` }, g);
    else sv("rect", { class: "shape", x: L, y: T, width: n.w, height: n.h, rx: n.sh === "pill" ? n.h / 2 : 12 }, g);
    if (n.sh === "rect") sv("rect", { class: "bar", x: L + 14, y: T, width: 22, height: 2.2, rx: 1.1 }, g);
    if (n.ring) sv("rect", { class: "ring", x: L - 6, y: T - 6, width: n.w + 12, height: n.h + 12, rx: 16 }, g);
    let ty, sy;
    if (n.img) { ty = T + 36; sy = T + n.h - 13; }
    else if (n.sh === "dia") { ty = n.y - 2; sy = n.y + 16; }
    else if (n.h >= 70) { ty = n.y + 5; sy = n.y + 24; }
    else { ty = n.y - 1; sy = n.y + 16; }
    if (n.img || (n.sh === "rect" && n.h >= 70)) {
      const k = sv("text", { class: "kind", x: n.x, y: T + 19, "text-anchor": "middle" }, g); k.textContent = kind;
    }
    const t = sv("text", { class: "t", x: n.x, y: ty, "text-anchor": "middle" }, g); t.textContent = n.t;
    const sub = sv("text", { class: "sub", x: n.x, y: sy, "text-anchor": "middle" }, g);
    let img = null;
    if (n.img) {
      sv("rect", { class: "thumb", x: n.x - 22, y: T + 46, width: 44, height: 44, rx: 6 }, g);
      img = sv("image", { x: n.x - 22, y: T + 46, width: 44, height: 44, preserveAspectRatio: "none", "clip-path": `url(#clip-${id})` }, g);
    }
    F.nodes[id] = { g, t, sub, img };
  }
  F.pk = sv("circle", { id: "pk", r: 3.6 }, svg);
}

function setSub(id, text) { if (F.nodes[id]) F.nodes[id].sub.textContent = text ?? ""; }
function fmt(ms) { return ms == null ? "–" : ms < 1 ? ms.toFixed(2) : ms < 10 ? ms.toFixed(1) : Math.round(ms); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function flowFill(tr) {
  const g = tr.gen && tr.gen[tr.gen.length - 1];
  const last = tr.last;
  const rf = tr.pred === "rf", nsteps = (tr.t_list || []).length || tr.steps || 1;
  F.nodes.step.t.textContent = rf ? "오일러 한 걸음" : "DDIM 한 걸음";
  setSub("key", last ? `'${last.ch}'` : "(빈 칸)");
  const j = (g || last || {}).jamo;
  setSub("parse", j ? (j.extra != null ? `추가 문자 '${j.extra}'` : [j.cho, j.jung, j.jong || "없음"].join(" · ")) : last && last.kind === "jamo" ? `'${last.ch}' 조합 중` : "");
  setSub("syl", last && last.kind === "jamo" ? "아직 아님" : `${tr.n_glyph}자 완성`);
  setSub("cache", `새 글자 ${tr.misses}`);
  setSub("jamo", last && last.kind === "jamo" ? `'${last.ch}' 생성 안 함` : "");
  setSub("hit", `${tr.hits}자 다시 씀`);
  setSub("paper", `${tr.n_glyph}자 · ${fmt(tr.total_ms)} ms`);
  if (g) {
    F.nodes.noise.img.setAttribute("href", "data:image/png;base64," + g.z);
    F.nodes.unet.img.setAttribute("href", "data:image/png;base64," + g.u);
    F.nodes.step.img.setAttribute("href", "data:image/png;base64," + g.x);
    setSub("noise", `'${g.ch}' 전용 노이즈`);
    setSub("unet", `${tr.misses}자 · ${fmt(tr.model_ms)} ms`);
    setSub("step", rf && nsteps === 1 ? "x = z + u" : `${nsteps}번 반복한 결과`);
    setSub("more", `0 / ${nsteps}`);
    setSub("png", `${fmt(tr.png_ms)} ms`);
  }
  // 메모지
  let msg;
  if (g) {
    const runs = nsteps * (tr.guided ? 2 : 1);
    msg = `<b>'${g.ch}'</b> 은(는) 처음 보는 글자라 캐시에 없습니다. 자모 [${g.cond.slice(0, 3).join(", ")}] 를 조건으로, `
        + `노이즈 z 에서 출발해 신경망을 <b>${runs}번</b> 돌려 글자를 만들었습니다`
        + (tr.misses > 1 ? ` (새 글자 ${tr.misses}개를 한 묶음으로).` : ".")
        + (tr.hits ? ` 나머지 ${tr.hits}자는 캐시에서 그대로 꺼냈습니다.` : "");
  } else if (last && last.kind === "jamo") {
    msg = `<b>'${last.ch}'</b> 은(는) 아직 조합 중인 낱자라 생성하지 않고 흐리게만 보여 줍니다. 음절이 완성되는 순간 생성합니다.`;
  } else if (tr.n_glyph) {
    msg = `새로 생긴 글자가 없어서 신경망을 돌리지 않았습니다. ${tr.hits}자 모두 캐시에서 꺼내 다시 놓았습니다.`;
  } else msg = "글자를 입력하면 여기에 과정이 나옵니다.";
  $("nmsg").innerHTML = msg;
  const tm = [["자모 분해", tr.parse_ms]];
  if (g) tm.push(["노이즈", tr.noise_ms], ["신경망", tr.model_ms, 1], ["PNG", tr.png_ms]);
  tm.push(["요청 전체", tr.total_ms, !g]);
  $("ntm").innerHTML = tm.map(([k, v, big]) => `<span class="${big ? "big" : ""}">${k} ${fmt(v)} ms</span>`).join("");
}

function flowPath(tr) {
  const last = tr.last;
  if (!last && !tr.n_glyph) return null;
  if (tr.misses > 0) return ["key", "e_key", "parse", "e_parse", "syl", "e_syl", "cache", "e_miss", "noise", "e_z",
                             "LOOP", "e_done", "png", "e_pp", "paper"];
  if (last && last.kind === "jamo") return ["key", "e_key", "parse", "e_parse", "syl", "e_jamo", "jamo", "e_jp", "paper"];
  return ["key", "e_key", "parse", "e_parse", "syl", "e_syl", "cache", "e_hit", "hit", "e_hp", "paper"];
}

function moveAlong(edge, run, speed = 1.5) {
  return new Promise((res) => {
    const L = edge.getTotalLength(), dur = Math.max(95, L / speed), t0 = performance.now(), seg = Math.min(46, L);
    F.comet.setAttribute("d", edge.getAttribute("d"));
    F.comet.style.strokeDasharray = `${seg} ${L + seg}`;
    F.comet.style.opacity = 1;
    const tick = (now) => {
      if (F.run !== run) return res(false);
      const raw = Math.min(1, (now - t0) / dur), k = raw < .5 ? 2 * raw * raw : 1 - (-2 * raw + 2) ** 2 / 2;
      const p = edge.getPointAtLength(L * k);
      F.pk.setAttribute("cx", p.x); F.pk.setAttribute("cy", p.y);
      F.comet.style.strokeDashoffset = seg - L * k;
      if (raw < 1) requestAnimationFrame(tick); else { F.comet.style.opacity = 0; res(true); }
    };
    requestAnimationFrame(tick);
  });
}

// 애니메이션 중에 새 요청이 오면 끊지 않고 가장 최근 것 하나만 기다렸다가 이어서 보여 줍니다.
async function flowRun(tr) {
  if (!tr) return;
  if (F.busy) { F.next = tr; return; }
  F.busy = true;
  try { await flowPlay(tr); } finally { F.busy = false; }
  if (F.next) { const t2 = F.next; F.next = null; flowRun(t2); }
}
async function flowPlay(tr) {
  const run = ++F.run;
  flowFill(tr);
  const path = flowPath(tr);
  const box = $("flow");
  document.querySelectorAll(".fn,.fe,.fl").forEach((e) => e.classList.remove("path", "on"));
  for (const e of Object.values(F.edges)) e.setAttribute("marker-end", "url(#ah)");
  if (!path) { box.classList.remove("ran"); F.pk.style.opacity = 0; F.comet.style.opacity = 0; return; }
  box.classList.add("ran");
  const nsteps = (tr.t_list || []).length || 1;
  const seq = path.flatMap((s) => s !== "LOOP" ? [s]
    : Array.from({ length: Math.min(nsteps, 4) }, (_, i) => ["unet", "e_u", "step", "e_x", "more", ...(i < Math.min(nsteps, 4) - 1 ? ["e_loop"] : [])]).flat());
  const mark = (s) => {
    if (FN[s]) F.nodes[s].g.classList.add("path");
    else { F.edges[s].classList.add("path"); F.edges[s].setAttribute("marker-end", "url(#ahp)"); F.labels[s]?.classList.add("path"); }
  };
  if (reduce) { seq.forEach(mark); setSub("more", `${nsteps} / ${nsteps}`); return; }
  F.pk.style.opacity = 1;
  let loops = 0;
  for (const s of seq) {
    if (F.run !== run) return;
    mark(s);
    if (FN[s]) {
      const n = F.nodes[s].g; n.classList.add("on");
      if (s === "more") { loops++; setSub("more", `${loops === Math.min(nsteps, 4) ? nsteps : loops} / ${nsteps}`); }
      await sleep(s === "unet" ? 320 : s === "key" ? 100 : 130);
      n.classList.remove("on");
    } else if (!(await moveAlong(F.edges[s], run))) return;
  }
  if (F.run === run) F.pk.style.opacity = 0;
}

// ---------------------------------------------------------------- 서버에서 최근 요청 받아 오기 (롱폴링)
let seq = -1;
async function listen() {
  for (;;) {
    try {
      const r = await fetch(`api/trace?after=${seq}`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const tr = await r.json();
      $("dot").classList.add("ok");
      if (tr.n_glyph != null && tr.seq !== seq) {
        seq = tr.seq;
        $("conn").textContent = "연결됨";
        $("typed").textContent = tr.text || "";
        flowRun(tr);
      } else {
        seq = tr.seq;
        if (seq <= 0) $("conn").innerHTML = '연결됨 · <a class="open" href="./" target="handwriting-demo">데모 페이지</a>에서 타자를 쳐 보세요';
      }
    } catch (e) {
      $("dot").classList.remove("ok");
      $("conn").textContent = "서버에 연결할 수 없습니다. live_demo.py 가 실행 중인지 확인하세요.";
      await new Promise((r) => setTimeout(r, 1500));
    }
  }
}
flowInit();
$("nmsg").textContent = "데모 페이지에서 타자를 치면 여기에 과정이 나옵니다.";
listen();
</script>
